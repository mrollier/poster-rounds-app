<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Poster map</title>
  <link rel="icon" href="data:,"><!-- real icons come with the PWA step -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" role="application" aria-label="Map of poster places"></div>

  <header class="bar">
    <div class="bar-title"><b>Poster map</b> <span id="campaign-name"></span></div>
    <button type="button" id="menu-btn" class="icon-btn" aria-label="Settings">☰</button>
  </header>

  <section id="sheet" class="sheet" aria-label="Stops">
    <div id="summary"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- First run and Settings: the same form. Part 2 (home, campaign) opens once the team code is checked. -->
  <form id="setup" class="setup" hidden novalidate>
    <h1>Poster map</h1>
    <p class="muted">Where to hang posters, in which order, and what the team has already done.</p>

    <label for="f-name">Your first name</label>
    <input id="f-name" name="name" autocomplete="given-name" maxlength="40" required>

    <label for="f-code">Team code</label>
    <input id="f-code" name="code" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <p class="hint">Ask the organiser for the code.</p>

    <div id="setup-part2" hidden>
      <fieldset>
        <legend>Home (optional)</legend>
        <p class="hint">Default start and end of your routes. Saved only on this phone, never sent anywhere.</p>
        <p id="home-state" class="home-state"></p>
        <div class="btns">
          <button type="button" class="btn" id="home-gps">Use my current location</button>
          <button type="button" class="btn" id="home-tap">Tap on the map</button>
          <button type="button" class="btn" id="home-clear">No home</button>
        </div>
      </fieldset>

      <div id="campaign-pick" hidden>
        <label for="f-campaign">Campaign</label>
        <select id="f-campaign" name="campaign"></select>
      </div>
    </div>

    <p id="setup-error" class="error" role="alert" hidden></p>
    <button type="submit" class="btn primary" id="setup-go">Continue</button>
  </form>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

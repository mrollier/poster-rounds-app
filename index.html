<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Poster map</title>
  <link rel="icon" href="data:,"><!-- real icons come with the PWA step -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" role="application" aria-label="Map of poster places"></div>

  <header class="bar">
    <div class="bar-title"><b>Poster map</b> <span id="campaign-name"></span></div>
    <button type="button" id="sync-btn" class="sync-btn" hidden></button>
    <button type="button" id="menu-btn" class="icon-btn" aria-label="Settings">☰</button>
  </header>

  <section id="sheet" class="sheet" aria-label="Stops">
    <!-- Sits on the top edge of the sheet, over the map: location messages and the follow-me button. -->
    <div class="map-tools">
      <div id="loc-msg" class="loc-msg" role="status" aria-live="polite" hidden>
        <span id="loc-text"></span>
        <span class="loc-acts">
          <button type="button" id="loc-retry" class="link-btn" hidden>Try again</button>
          <button type="button" id="loc-hide" class="link-btn">Hide</button>
        </span>
      </div>
      <button type="button" id="follow-btn" class="icon-btn follow" aria-pressed="false" aria-label="Follow my location">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/>
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body">
      <button type="button" id="sheet-toggle" class="sheet-toggle" aria-expanded="false" aria-controls="sheet-more">
        <span class="grip" aria-hidden="true"></span><span id="sheet-toggle-text">Show all stops</span>
      </button>
      <div id="next"></div>
      <div id="sheet-more" hidden>
        <div id="stats" class="stats"></div>
        <h2 id="list-title">Stops</h2>
        <ol id="stops" class="stops"></ol>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- First run and Settings: the same form. Part 2 (home, campaign) opens once the team code is checked. -->
  <form id="setup" class="setup" hidden novalidate>
    <h1>Poster map</h1>
    <p class="muted">Where to hang posters, in which order, and what the team has already done.</p>

    <label for="f-name">Your first name</label>
    <input id="f-name" name="name" autocomplete="given-name" maxlength="40" required>

    <label for="f-code">Team code</label>
    <input id="f-code" name="code" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <p class="hint">Ask the organiser for the code.</p>

    <div id="setup-part2" hidden>
      <fieldset>
        <legend>Home (optional)</legend>
        <p class="hint">Default start and end of your routes. Saved only on this phone, never sent anywhere.</p>
        <p id="home-state" class="home-state"></p>
        <div class="btns">
          <button type="button" class="btn" id="home-gps">Use my current location</button>
          <button type="button" class="btn" id="home-tap">Tap on the map</button>
          <button type="button" class="btn" id="home-clear">No home</button>
        </div>
      </fieldset>

      <div id="campaign-pick" hidden>
        <label for="f-campaign">Campaign</label>
        <select id="f-campaign" name="campaign"></select>
      </div>
    </div>

    <p id="setup-error" class="error" role="alert" hidden></p>
    <button type="submit" class="btn primary" id="setup-go">Continue</button>
  </form>

  <!-- One dialog for every question (how many posters, a note, a reason). -->
  <dialog id="dlg" class="dlg">
    <form method="dialog">
      <p id="dlg-msg"></p>
      <input id="dlg-in" autocomplete="off">
      <div class="dlg-btns">
        <button value="ok" id="dlg-ok" class="btn primary">OK</button>
        <button value="cancel" id="dlg-no" class="btn" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
